name: Verify 1246
on: push
permissions:
  contents: read
jobs:
  verify:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 90
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      command: |
        git fetch --no-tags origin f5b19dcbf04b66d407867c02327e67f10d7a6413
        git checkout --detach f5b19dcbf04b66d407867c02327e67f10d7a6413
        test "$(git rev-parse HEAD)" = f5b19dcbf04b66d407867c02327e67f10d7a6413
        cargo fmt --all -- --check
        cargo test -p designcraft-ui-egui --lib synthetic_variable
        cargo test -p designcraft-ui-egui --lib
        cargo test -p designcraft-fonts --lib
        cargo xtask ci
