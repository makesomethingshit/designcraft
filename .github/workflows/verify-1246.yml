name: Verify 1246
on: push
permissions:
  contents: read
jobs:
  verify:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 90
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      command: |
        git fetch --no-tags origin c7327d1b0704449ac22ab788e2fda6cfb54cae98
        git checkout --detach c7327d1b0704449ac22ab788e2fda6cfb54cae98
        test "$(git rev-parse HEAD)" = c7327d1b0704449ac22ab788e2fda6cfb54cae98
        cargo fmt --all -- --check
        cargo clippy --workspace --all-targets -- -D warnings
        cargo test -p designcraft-ui-egui --lib
        cargo test -p designcraft-fonts --lib
        cargo xtask ci
